name: Enrich restaurant web details
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_web.py
      - .github/workflows/enrich-web.yml
  schedule:
    - cron: '40 * * * *' # Resume hourly; completed pages are not fetched again.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: restaurant-data
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public web facts and analyse visit points
        id: crawl
        continue-on-error: true
        run: python3 -u scripts/enrich_web.py --limit 1800 --seconds 2700 --workers 3 --interval 0.8 --owner-limit 80
      - name: Persist public details and progress
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .collection/web-state.json data/enrichment
          if git diff --cached --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m 'data: enrich public restaurant facts and visit points'
          git pull --rebase origin main
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - if: steps.persist.outputs.changed == 'true'
        run: python3 scripts/build_static.py
      - uses: actions/configure-pages@v5
        if: steps.persist.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.persist.outputs.changed == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.persist.outputs.changed == 'true'
        id: deployment
      - name: Report retrieval failure
        if: steps.crawl.outcome == 'failure'
        run: exit 1
